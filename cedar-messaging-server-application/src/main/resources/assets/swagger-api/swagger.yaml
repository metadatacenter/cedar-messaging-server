openapi: 3.0.1
info:
  description: |
    Better Metadata - Better Science

    The messaging server carries messages to CEDAR users: what the workbench shows as a
    notification, and what a background process sends when it has something to report.

    Every endpoint acts on the caller's own messages. Sending in a process's name is the one thing
    here that needs a permission beyond being logged in.
  title: CEDAR Messaging Server API
  version: 2.9.7-SNAPSHOT
paths:
  /command/mark-all-as-read:
    post:
      description: "Mark all of the caller's unread messages read at once, and report\
        \ how many that was. Acts only on the caller's own messages."
      operationId: markAllAsRead
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatedCount"
          description: How many messages were marked read
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
      security:
      - api_key: []
      summary: Mark every message as read
      tags:
      - Messages
  /messages:
    get:
      description: "Return the caller's messages along with the same counts the summary\
        \ reports. A sender whose display name cannot be resolved — a deleted account,\
        \ or the user server being unreachable — is returned without one rather than\
        \ failing the listing."
      operationId: getMessages
      parameters:
      - description: Return only messages in this notification state. Omit it for
          all of them.
        in: query
        name: notification_status
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
          description: "The caller's messages, with total, unread and not-notified\
            \ counts"
        "400":
          description: The notification status is not one of the accepted values
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
      security:
      - api_key: []
      summary: List the caller's messages
      tags:
      - Messages
    post:
      description: "Send a message to one user. The recipient is required and must\
        \ be a user: broadcast is not supported. The sender defaults to the caller;\
        \ naming a sender means sending on behalf of a process, which needs the process-message\
        \ permission."
      operationId: postMessage
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageRequest"
        description: The message and its recipient
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
          description: The message as stored
        "400":
          description: "No recipient, an unsupported recipient type, or a named sender\
            \ that is not a known process"
        "401":
          description: Unauthorized
        "403":
          description: Sending in a process's name without the permission to do so
        "404":
          description: No such recipient
        "500":
          description: Internal server error
      security:
      - api_key: []
      summary: Send a message
      tags:
      - Messages
  /messages/{id}:
    patch:
      description: "Change the notification state of one of the caller's own messages,\
        \ as a JSON merge patch carrying `notificationStatus`. Nothing else about\
        \ a message can be changed."
      operationId: patchMessage
      parameters:
      - description: Message identifier.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/MessageNotificationPatch"
        description: The new notification state
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
          description: The message as updated
        "400":
          description: The notification status is missing or not one of the accepted
            values
        "401":
          description: Unauthorized
        "403":
          description: The message belongs to someone else
        "404":
          description: No such message
        "500":
          description: Internal server error
      security:
      - api_key: []
      summary: Update a message's notification state
      tags:
      - Messages
  /summary:
    get:
      description: "Report how many messages the caller has in total, how many are\
        \ unread, and how many have not yet been notified. This is the counts alone,\
        \ for a workbench badge that does not want the messages themselves."
      operationId: getSummary
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageSummary"
          description: "Total, unread, and not-yet-notified counts"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
      security:
      - api_key: []
      summary: Count the caller's messages
      tags:
      - Messages
components:
  schemas:
    Message:
      type: object
      additionalProperties: false
      properties:
        body:
          type: string
          nullable: true
        creationDate:
          type: string
          format: date-time
        from:
          $ref: "#/components/schemas/MessageSender"
        id:
          type: string
          format: uri
        notificationStatus:
          type: string
          enum:
          - notnotified
          - notified
        readStatus:
          type: string
          enum:
          - unread
          - read
        subject:
          type: string
          nullable: true
      required:
      - creationDate
      - from
      - id
      - notificationStatus
      - readStatus
    MessageNotificationPatch:
      type: object
      additionalProperties: false
      properties:
        notificationStatus:
          type: string
          enum:
          - notnotified
          - notified
      required:
      - notificationStatus
    MessagePage:
      type: object
      additionalProperties: false
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        notnotified:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        unread:
          type: integer
          format: int64
      required:
      - messages
      - notnotified
      - total
      - unread
    MessageRecipient:
      type: object
      additionalProperties: false
      properties:
        '@id':
          type: string
          format: uri
        recipientType:
          type: string
          enum:
          - user
      required:
      - '@id'
      - recipientType
    MessageRequest:
      type: object
      additionalProperties: false
      properties:
        '@id':
          type: string
          format: uri
          description: Accepted for compatibility but ignored; the server assigns
            the message identifier.
        body:
          type: string
        from:
          $ref: "#/components/schemas/MessageSenderRequest"
        subject:
          type: string
        to:
          $ref: "#/components/schemas/MessageRecipient"
      required:
      - to
    MessageSender:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uri
        processId:
          type: string
          enum:
          - submission.IMMPORT
          - submission.NCBI
          nullable: true
        screenName:
          type: string
          nullable: true
        senderType:
          type: string
          enum:
          - user
          - process
      required:
      - id
      - senderType
    MessageSenderRequest:
      type: object
      additionalProperties: false
      description: Optional process identity to send as; ordinary user messages omit
        this object.
      properties:
        '@id':
          type: string
          format: uri
        processId:
          type: string
          enum:
          - submission.IMMPORT
          - submission.NCBI
        senderType:
          type: string
          enum:
          - process
      required:
      - processId
      - senderType
    MessageSummary:
      type: object
      additionalProperties: false
      properties:
        notnotified:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        unread:
          type: integer
          format: int64
      required:
      - notnotified
      - total
      - unread
    UpdatedCount:
      type: object
      additionalProperties: false
      properties:
        updated:
          type: integer
          format: int32
      required:
      - updated
  securitySchemes:
    api_key:
      description: "Your CEDAR API key, using the format 'apiKey <yourApiKey>'"
      in: header
      name: Authorization
      type: apiKey
